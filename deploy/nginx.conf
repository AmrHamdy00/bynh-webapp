# bynh.sa — static Next.js export served by nginx.
# WordPress runs headless at cms.bynh.sa and only feeds the blog (at build time) and post media (/wp-content/).
# Save this file as UTF-8: it contains Arabic paths. nginx matches against the decoded URI, so Arabic folders work as-is.

server {
    listen 80;
    listen [::]:80;
    server_name bynh.sa www.bynh.sa;
    return 301 https://bynh.sa$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.bynh.sa;
    ssl_certificate     /etc/letsencrypt/live/bynh.sa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bynh.sa/privkey.pem;
    return 301 https://bynh.sa$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bynh.sa;

    ssl_certificate     /etc/letsencrypt/live/bynh.sa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bynh.sa/privkey.pem;

    # scripts/deploy.sh switches this symlink atomically to the newest build
    root /var/www/bynh/current;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 1024;

    # ---- pages that are gone on the new site ---------------------------------------------------
    location = /training/   { return 301 /; }
    location = /landing/    { return 301 /; }
    location = /soon/       { return 301 /; }
    location = /my-account/ { return 301 /; }
    location = /checkout/   { return 301 /; }
    location = /بينه-محامين-مرخصين/ { return 301 /; }      # old WordPress home page slug
    location = /افضل-محامي-في-الرياض/ { return 301 /المدونة/; }  # deleted post still linked from 7 articles

    # WordPress admin/login moved to the CMS host
    location ~ ^/(wp-admin|wp-login\.php) { return 301 https://cms.bynh.sa$request_uri; }

    # ---- WordPress media and feed come from the CMS --------------------------------------------
    location /wp-content/ {
        proxy_pass https://cms.bynh.sa;
        proxy_set_header Host cms.bynh.sa;
        proxy_ssl_server_name on;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }
    location = /feed/ {
        proxy_pass https://cms.bynh.sa/feed/;
        proxy_set_header Host cms.bynh.sa;
        proxy_ssl_server_name on;
    }

    # ---- static assets ------------------------------------------------------------------------
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location /img/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }
    location = /blog-index.json { add_header Cache-Control "public, max-age=300" always; }

    # ---- pages: /path/ -> /path/index.html ------------------------------------------------------
    # add the trailing slash WordPress always used (keeps every old URL identical)
    rewrite ^([^.]*[^/])$ $1/ permanent;

    location / {
        try_files $uri $uri/index.html $uri.html =404;
        add_header Cache-Control "public, max-age=300" always;
    }

    error_page 404 /404.html;
}
