# bynh.sa + admin.bynh.sa → Next.js on 127.0.0.1:3000 (systemd: deploy/bynh-web.service).
# Save as UTF-8 (Arabic paths). Test with `nginx -t` before reloading.

# Cache of public HTML: if the app is restarting or down, visitors (and Googlebot) still get the last good page.
proxy_cache_path /var/cache/nginx/bynh levels=1:2 keys_zone=bynh:50m max_size=2g inactive=7d use_temp_path=off;
limit_req_zone $binary_remote_addr zone=bynh_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=bynh_collect:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=bynh_forms:10m rate=5r/m;

upstream bynh_app { server 127.0.0.1:3000; keepalive 32; }

server {
    listen 80; listen [::]:80;
    server_name bynh.sa www.bynh.sa admin.bynh.sa;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name www.bynh.sa;
    ssl_certificate /etc/letsencrypt/live/bynh.sa/fullchain.pem; ssl_certificate_key /etc/letsencrypt/live/bynh.sa/privkey.pem;
    return 301 https://bynh.sa$request_uri;
}

# ───────────────────────────── public site ─────────────────────────────
server {
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name bynh.sa;
    ssl_certificate /etc/letsencrypt/live/bynh.sa/fullchain.pem; ssl_certificate_key /etc/letsencrypt/live/bynh.sa/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    charset utf-8;
    server_tokens off;
    client_max_body_size 64k;

    gzip on; gzip_types text/css application/javascript application/json application/xml application/rss+xml image/svg+xml text/plain; gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    # optional: country for analytics if the GeoIP2 module is installed →  proxy_set_header X-Country-Code $geoip2_country_code;

    # uploads: straight from disk, same addresses WordPress used
    location /wp-content/uploads/ {
        alias /var/lib/bynh/uploads/;
        expires 1y; add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        location ~* \.(php|phtml|html?|svg|js)$ { return 404; }
        try_files $uri =404;
    }
    location /_next/static/ {
        alias /opt/bynh-web/.next/static/;
        expires 1y; add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location /img/ { alias /opt/bynh-web/public/img/; expires 30d; }

    # the admin never answers on the public host
    location ^~ /admin { return 404; }
    location ^~ /api/admin/ { return 404; }

    location = /api/collect/ { limit_req zone=bynh_collect burst=60 nodelay; access_log off; proxy_pass http://bynh_app; }
    location ^~ /api/forms/ { limit_req zone=bynh_forms burst=3 nodelay; proxy_pass http://bynh_app; }

    location / {
        proxy_pass http://bynh_app;
        proxy_cache bynh;
        proxy_cache_key $scheme$host$request_uri;
        proxy_cache_valid 200 301 308 1m;
        proxy_cache_valid 404 10s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_bypass $http_rsc $arg__rsc;   # never cache React Server Component payloads
        proxy_no_cache $http_rsc $arg__rsc;
        add_header X-Cache $upstream_cache_status always;
    }
}

# ───────────────────────────── admin ─────────────────────────────
server {
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name admin.bynh.sa;
    ssl_certificate /etc/letsencrypt/live/bynh.sa/fullchain.pem; ssl_certificate_key /etc/letsencrypt/live/bynh.sa/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 12m;

    # Optional extra wall: allow only office/VPN IPs (uncomment and fill in).
    # allow 203.0.113.10; deny all;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /wp-content/uploads/ { alias /var/lib/bynh/uploads/; try_files $uri =404; }
    location /_next/static/ { alias /opt/bynh-web/.next/static/; expires 1y; }
    location = /admin/login/ { limit_req zone=bynh_login burst=5 nodelay; proxy_pass http://bynh_app; }
    location / { proxy_pass http://bynh_app; proxy_buffering off; }
}
